name: Publicar no Supabase
# Publica banco (migrações), Edge Functions e segredos no projeto Supabase, sem precisar de nada instalado no computador.
# Precisa de três segredos do repositório: SUPABASE_ACCESS_TOKEN, SUPABASE_PROJECT_REF e SUPABASE_DB_PASSWORD.
# Sem eles, o workflow termina sem fazer nada (não quebra o main).
on:
  push:
    branches: [main]
    paths:
      - 'supabase/**'
      - 'scripts/publicar/**'
      - '.github/workflows/publicar-supabase.yml'
  workflow_dispatch:
    inputs:
      email_lana:
        description: 'E-mail da Lana (libera o acesso e envia o convite). Deixe vazio se já foi feito.'
        required: false
        default: ''
      email_marcus:
        description: 'E-mail do Marcus (libera o acesso e envia o convite). Deixe vazio se já foi feito.'
        required: false
        default: ''
      refazer_webhook:
        description: 'Registrar de novo o webhook do Telegram (use se trocou o bot).'
        type: boolean
        default: false

concurrency:
  group: publicar-supabase
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
    steps:
      - name: Conferir configuração
        id: cfg
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "pronto=nao" >> "$GITHUB_OUTPUT"
            echo "### Supabase ainda não configurado" >> "$GITHUB_STEP_SUMMARY"
            echo "Cadastre SUPABASE_ACCESS_TOKEN, SUPABASE_PROJECT_REF e SUPABASE_DB_PASSWORD em Settings > Secrets and variables > Actions." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "pronto=sim" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.cfg.outputs.pronto == 'sim'

      - uses: actions/setup-node@v4
        if: steps.cfg.outputs.pronto == 'sim'
        with:
          node-version: 22

      - uses: supabase/setup-cli@v1
        if: steps.cfg.outputs.pronto == 'sim'
        with:
          version: latest

      - name: Ligar ao projeto
        if: steps.cfg.outputs.pronto == 'sim'
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Aplicar migrações
        if: steps.cfg.outputs.pronto == 'sim'
        run: supabase db push --password "$SUPABASE_DB_PASSWORD" --include-all

      - name: Segredos das funções
        if: steps.cfg.outputs.pronto == 'sim'
        env:
          SHOPEE_AFFILIATE_APP_ID: ${{ secrets.SHOPEE_AFFILIATE_APP_ID }}
          SHOPEE_AFFILIATE_APP_SECRET: ${{ secrets.SHOPEE_AFFILIATE_APP_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          TELEGRAM_LANA_CHAT_ID: ${{ secrets.TELEGRAM_LANA_CHAT_ID }}
          ROUTINE_CURADORIA_ID: ${{ secrets.ROUTINE_CURADORIA_ID }}
          ROUTINE_CURADORIA_TOKEN: ${{ secrets.ROUTINE_CURADORIA_TOKEN }}
          ROUTINE_REDACAO_ID: ${{ secrets.ROUTINE_REDACAO_ID }}
          ROUTINE_REDACAO_TOKEN: ${{ secrets.ROUTINE_REDACAO_TOKEN }}
          ROUTINE_ATENDENTE_ID: ${{ secrets.ROUTINE_ATENDENTE_ID }}
          ROUTINE_ATENDENTE_TOKEN: ${{ secrets.ROUTINE_ATENDENTE_TOKEN }}
          ROUTINE_ANALISTA_ID: ${{ secrets.ROUTINE_ANALISTA_ID }}
          ROUTINE_ANALISTA_TOKEN: ${{ secrets.ROUTINE_ANALISTA_TOKEN }}
          ROUTINE_RADAR_ID: ${{ secrets.ROUTINE_RADAR_ID }}
          ROUTINE_RADAR_TOKEN: ${{ secrets.ROUTINE_RADAR_TOKEN }}
          ROUTINE_COACH_ID: ${{ secrets.ROUTINE_COACH_ID }}
          ROUTINE_COACH_TOKEN: ${{ secrets.ROUTINE_COACH_TOKEN }}
          AGENTES_MODO: ${{ vars.AGENTES_MODO }}
          NOTIFICACOES_MODO: ${{ vars.NOTIFICACOES_MODO }}
          SHOPEE_MODO: ${{ vars.SHOPEE_MODO }}
          TELEGRAM_MODO: ${{ vars.TELEGRAM_MODO }}
          VAPID_SUBJECT: ${{ vars.VAPID_SUBJECT }}
        run: node scripts/publicar/executar.ts segredos

      - name: Vault do pg_cron
        if: steps.cfg.outputs.pronto == 'sim'
        run: node scripts/publicar/executar.ts vault

      - name: Configurar login
        if: steps.cfg.outputs.pronto == 'sim'
        run: node scripts/publicar/executar.ts auth

      - name: Publicar funções
        if: steps.cfg.outputs.pronto == 'sim'
        run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF" --use-api --import-map supabase/functions/import_map.json

      - name: Liberar acessos
        if: steps.cfg.outputs.pronto == 'sim' && (inputs.email_lana != '' || inputs.email_marcus != '')
        env:
          EMAIL_LANA: ${{ inputs.email_lana }}
          EMAIL_MARCUS: ${{ inputs.email_marcus }}
        run: node scripts/publicar/executar.ts acessos

      - name: Telegram (webhook e comandos)
        if: steps.cfg.outputs.pronto == 'sim'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          REFAZER_WEBHOOK: ${{ inputs.refazer_webhook }}
        run: node scripts/publicar/executar.ts telegram
